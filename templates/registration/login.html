{% extends "base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Вхід</h1>

        {% if form.errors %}
          <div class="alert alert-danger">Невірний логін або пароль.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label for="id_username" class="form-label">Логін</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Увійти</button>
          </div>
        </form>

        <p class="small text-center mt-3 mb-0">Немає акаунта? <a href="{% url 'signup' %}">Зареєструватись</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
